[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openrgb-control"
version = "0.3.0"
description = "Simple RGB lighting control for OpenRGB devices"
readme = "README.md"
authors = [
    {name = "RGB Control Team"}
]
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "psutil>=5.8.0",
    "loguru>=0.7.0",
    "openrgb-python>=0.3.3",
    "streamlit>=1.30.0",
    "nvidia-ml-py>=13.590.48",
]
keywords = ["rgb", "lighting", "openrgb", "effects"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/example/openrgb-control"
Repository = "https://github.com/example/openrgb-control"

[tool.hatch.build.targets.wheel]
packages = ["src/openrgb_control"]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-timeout>=2.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md"]
